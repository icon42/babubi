{% load imagekit static %}
{% if child.picture %}
    {% thumbnail '40x40' child.picture as thumb %}
        <img src="{{ thumb.url }}" class="img-fluid rounded-circle" />
    {% else %}
        <img src="{% static 'babubi/img/core/child-placeholder.png' %}"
             width="40"
             height="40"
             class="img-fluid rounded-circle child-placeholder" />
        {% if with_inverse %}
            {# Shown instead on a chosen chip of the child selector (forms.scss). #}
            <img src="{% static 'babubi/img/core/child-placeholder-inverse.png' %}"
                 width="40"
                 height="40"
                 class="img-fluid rounded-circle child-placeholder_inverse" />
        {% endif %}
    {% endif %}
