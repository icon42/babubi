{% extends "cards/base.html" %}
{% load i18n %}
{% block header %}
    <a href="{% url report.url child.slug %}">{{ report.label }}</a>
{% endblock %}
{% block content %}
    {% if html %}
        <div class="card-report-graph"
             style="--graph-height: {{ report.height }}px"
             data-series-color="{{ report.series_color|default:'' }}">{{ html|safe }}</div>
        {{ js|safe }}
    {% else %}
        <p class="text-body-secondary mb-0">{% trans "There is not enough data to generate this report." %}</p>
    {% endif %}
{% endblock %}
